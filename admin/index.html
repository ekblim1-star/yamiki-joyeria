<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yamiki Joyería S925 | Panel de Administración</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SheetJS / XLSX para parsear Excel del Scraper en el navegador -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- heic2any para convertir fotos HEIC de iPhone automáticamente a JPEG -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

  <!-- Estilos Custom -->
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="min-h-screen bg-[#0C100E] text-[#F0F4F2] flex flex-col antialiased select-none">

  <!-- ========================================================================
       PANTALLA DE BLOQUEO / PIN DE SEGURIDAD (ADMIN LOCK SCREEN)
       ======================================================================== -->
  <div id="admin-lock-screen" class="fixed inset-0 z-50 bg-[#0C100E] flex items-center justify-center p-4">
    <div class="max-w-sm w-full bg-[#141C18] border border-white/10 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 text-center relative overflow-hidden">
      <!-- Glow ambiental decorativo -->
      <div class="absolute -top-12 -left-12 w-32 h-32 bg-[#e72380]/20 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#1b2520] to-[#25101c] border border-white/15 flex items-center justify-center mx-auto text-[#e72380] shadow-xl">
        <i data-lucide="lock" class="w-7 h-7"></i>
      </div>

      <div class="space-y-1.5">
        <h2 class="text-xl font-extrabold text-white tracking-tight">Acceso Administrativo</h2>
        <p class="text-xs text-gray-400">Ingresa tu PIN de seguridad para gestionar Yamiki Joyería.</p>
      </div>

      <form id="admin-pin-form" onsubmit="handlePinSubmit(event)" class="space-y-4">
        <div class="relative">
          <input
            type="password"
            id="admin-pin-input"
            maxlength="60"
            required
            autocomplete="current-password"
            placeholder="Ingresa tu contraseña o PIN"
            class="w-full px-4 py-3 bg-black/50 border border-white/15 rounded-2xl text-center text-lg font-bold tracking-widest text-white focus:outline-none focus:border-[#e72380] transition placeholder:text-xs placeholder:font-normal placeholder:tracking-normal"
          />
          <button
            type="button"
            onclick="togglePinVisibility()"
            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white p-1"
            title="Ver / Ocultar PIN"
          >
            <i id="pin-eye-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>

        <p id="pin-error-msg" class="text-xs text-rose-400 font-bold hidden"></p>

        <button
          type="submit"
          id="pin-submit-btn"
          class="w-full py-3 rounded-2xl bg-[#e72380] hover:bg-[#d41c73] text-white text-xs font-bold transition shadow-lg shadow-[#e72380]/25 flex items-center justify-center gap-2"
        >
          <i data-lucide="key-round" class="w-4 h-4"></i>
          <span>Desbloquear Panel</span>
        </button>
      </form>

      <div class="pt-2 border-t border-white/5">
        <a href="../index.html" class="text-[11px] text-gray-400 hover:text-gray-200 transition inline-flex items-center gap-1">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>Volver a la tienda pública</span>
        </a>
      </div>
    </div>
  </div>




  <!-- Contenedor del Dashboard (Vacío al cargar; solo se monta tras verificar la clave de acceso) -->
  <div id="admin-app-root"></div>

  <!-- Contenedor de Notificaciones Toast -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none"></div>

  <!-- Scripts -->
  <script src="admin.js"></script>
</body>
</html>
